<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#22C55E" />
    <title>Lingo</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        background: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        color: #0f172a;
        text-align: center;
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 12px 32px rgba(34, 197, 94, 0.28);
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.2px;
        color: #16a34a;
      }
      p {
        margin: 0;
        max-width: 22rem;
        font-size: 15px;
        line-height: 1.5;
        color: #64748b;
      }
      .spinner {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 3px solid #dcfce7;
        border-top-color: #22c55e;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="mascot.svg" alt="Lingo" />
    <div>
      <h1>Lingo</h1>
      <p>Loading your lessons…</p>
    </div>
    <div class="spinner" role="status" aria-label="Loading"></div>
  </body>
</html>
